<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Image Viewer</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 32px 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            text-align: center;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .input-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 32px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: monospace, monospace;
            font-size: 0.875rem;
            resize: vertical;
            background-color: #fafafa;
            color: #334155;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #fff;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-secondary {
            background-color: var(--accent-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .status-message {
            margin-top: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .status-message.error {
            color: #dc2626;
            display: block;
        }

        .status-message.success {
            color: #16a34a;
            display: block;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .stats-count {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        .image-container {
            width: 100%;
            height: 200px;
            background-color: #f1f5f9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        .no-image {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            padding: 20px;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .badge-major {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .badge-minor {
            background-color: #fefce8;
            color: #ca8a04;
            border: 1px solid #fef08a;
        }

        .badge-default {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .remark-box {
            background-color: var(--bg-color);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.825rem;
            color: #475569;
            margin-top: 8px;
            margin-bottom: 16px;
            border: 1px solid #f1f5f9;
            word-break: break-word;
            flex-grow: 1;
        }

        .download-btn {
            width: 100%;
            background-color: var(--accent-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-top: auto;
        }

        .download-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 2px dashed var(--border-color);
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            stroke: #94a3b8;
        }

        /* Modal for Viewing Full Image */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Defect Image Viewer</h1>
        <p>Paste defect data from spreadsheet</p>
    </header>

    <div class="input-section">
        <label for="jsonInput">Paste Cell JSON Data here</label>
        <textarea id="jsonInput" placeholder='[{"name":"Crack","category":"Major","quantity":"5","remark":"PIN SHAFT CRACK","imageUrl":"data:image/jpeg;base64,..."}]'></textarea>
        
        <div class="button-group">
            <button onclick="parseAndDisplay()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                Process Data
            </button>
            <button class="btn-secondary" onclick="clearAll()">Clear</button>
        </div>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <div class="stats-bar" id="statsBar" style="display: none;">
        <span class="stats-count" id="itemCount">0 Items Found</span>
    </div>

    <div id="cardsGrid" class="grid-container">
        <div class="empty-state" id="emptyState">
            <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p>No JSON data loaded yet. Paste your data above and click "Process Data".</p>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage" alt="Enlarged view">
    </div>

    <script>
        function parseAndDisplay() {
            const inputVal = document.getElementById('jsonInput').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            const grid = document.getElementById('cardsGrid');
            const statsBar = document.getElementById('statsBar');
            const itemCount = document.getElementById('itemCount');

            // Reset UI
            statusMsg.className = 'status-message';
            statusMsg.innerText = '';
            grid.innerHTML = '';

            if (!inputVal) {
                showStatus('Please paste JSON data into the box.', 'error');
                showEmptyState();
                return;
            }

            try {
                let parsed = JSON.parse(inputVal);

                // Handle single object vs array
                if (!Array.isArray(parsed)) {
                    parsed = [parsed];
                }

                if (parsed.length === 0) {
                    showStatus('JSON array is empty.', 'error');
                    showEmptyState();
                    return;
                }

                showStatus(`Successfully parsed ${parsed.length} item(s).`, 'success');
                statsBar.style.display = 'flex';
                itemCount.innerText = `${parsed.length} Item${parsed.length > 1 ? 's' : ''} Displayed`;

                parsed.forEach((item, index) => {
                    const card = createCard(item, index);
                    grid.appendChild(card);
                });

            } catch (e) {
                showStatus('Invalid JSON format. Make sure you copied the entire cell text accurately.', 'error');
                showEmptyState();
            }
        }

        function createCard(item, index) {
            const card = document.createElement('div');
            card.className = 'card';

            const name = item.name || 'Unnamed Item';
            const category = item.category || 'General';
            const quantity = item.quantity || item.qty || '1';
            const remark = item.remark || item.remarks || '';
            const imageUrl = item.imageUrl || item.image || item.img || '';

            // Badge styling logic
            let badgeClass = 'badge-default';
            if (category.toLowerCase().includes('major')) badgeClass = 'badge-major';
            else if (category.toLowerCase().includes('minor')) badgeClass = 'badge-minor';

            // Image Container HTML
            let imageHtml = '';
            if (imageUrl) {
                imageHtml = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="${escapeHtml(name)}" onclick="openModal('${imageUrl}')" style="cursor: pointer;" title="Click to view full screen">
                    </div>
                `;
            } else {
                imageHtml = `
                    <div class="image-container">
                        <div class="no-image">No Image Available</div>
                    </div>
                `;
            }

            // Download button HTML
            let downloadBtnHtml = '';
            if (imageUrl) {
                const safeName = name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const fileName = `${safeName}_item_${index + 1}.jpg`;
                downloadBtnHtml = `
                    <button class="download-btn" onclick="downloadImage('${imageUrl}', '${fileName}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Image
                    </button>
                `;
            }

            card.innerHTML = `
                ${imageHtml}
                <div class="card-body">
                    <div class="card-header-info">
                        <div class="card-title">${escapeHtml(name)}</div>
                        <span class="badge ${badgeClass}">${escapeHtml(category)}</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Quantity:</span>
                        <span class="info-value">${escapeHtml(String(quantity))}</span>
                    </div>

                    ${remark ? `
                        <div class="info-row" style="margin-bottom: 2px;">
                            <span class="info-label">Remark:</span>
                        </div>
                        <div class="remark-box">${escapeHtml(remark)}</div>
                    ` : '<div style="flex-grow: 1;"></div>'}

                    ${downloadBtnHtml}
                </div>
            `;

            return card;
        }

        function downloadImage(dataUrl, fileName) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.className = `status-message ${type}`;
            statusMsg.innerText = message;
        }

        function showEmptyState() {
            const grid = document.getElementById('cardsGrid');
            const statsBar = document.getElementById('statsBar');
            statsBar.style.display = 'none';
            grid.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <p>No JSON data loaded yet. Paste your data above and click "Process Data".</p>
                </div>
            `;
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('statusMessage').className = 'status-message';
            document.getElementById('statusMessage').innerText = '';
            showEmptyState();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
