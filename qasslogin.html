<!DOCTYPE html>
<html>
<head>
    <title>Google Auth</title>
</head>
<body  style="  display: grid;
    min-height: 100vh;
    box-sizing: border-box;
    place-items: center;
    padding: 20px;
    background: rgb(243, 246, 250);" >
    <button onclick="login()" id="btn" style="display:none;cursor: pointer;color:white;
    font-weight: 600;
    padding: 0.75rem 1.4rem;
    border-width: 1px;
    border-style: solid;
    border-color: transparent;
    border-image: none;
    background: #37b3fa;    box-shadow: rgba(24, 39, 58, 0.1) 0px 12px 32px;border-radius: 10px;">Click to Authorize Google </button>
    
<script>
        let client;

        function initClient() {
            client = google.accounts.oauth2.initTokenClient({
                client_id: '118920846900-2q1e13cuc7j1du9fnd6jse6q7ee2ldk3.apps.googleusercontent.com',
                scope: [
                    'https://www.googleapis.com/auth/gmail.send',
                    'https://www.googleapis.com/auth/drive.file',
                    'https://www.googleapis.com/auth/spreadsheets',
                    'https://www.googleapis.com/auth/userinfo.email'
                ].join(' '),
                callback: async (resp) => {
                    if (resp.access_token) {
                        const user = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: `Bearer ${resp.access_token}` }
                        }).then(r => r.json());

                        const expiresInMs = (resp.expires_in || 3600) * 1000;
                        const expiryTime = Date.now() + expiresInMs;

                        // Send payload back to parent window
                        if (window.opener) {
                            window.opener.postMessage({
                                type: 'GMAIL_AUTH_SUCCESS', // Kept unchanged so your parent listener still works
                                token: resp.access_token,
                                email: user.email,
                                expiry: expiryTime
                            }, '*');
                            window.close(); // Close popup
                        }
                    }
                }
            });
            document.getElementById('btn').style.display = 'block';
        }

        function login() { client.requestAccessToken(); }
    </script>

    <script src="https://accounts.google.com/gsi/client" onload="initClient()"></script>
</body>
</html>
